upstream hotelos_reception {
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream hotelos_housekeeping {
    server 127.0.0.1:8002;
    keepalive 16;
}

upstream hotelos_roomservice {
    server 127.0.0.1:8003;
    keepalive 16;
}

upstream hotelos_maintenance {
    server 127.0.0.1:8004;
    keepalive 16;
}

upstream hotelos_dashboard {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name programming.asilbek.tech;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://hotelos_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://hotelos_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location /api/reception/ {
        rewrite ^/api/reception/(.*) /$1 break;
        proxy_pass http://hotelos_reception;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /api/housekeeping/ {
        rewrite ^/api/housekeeping/(.*) /$1 break;
        proxy_pass http://hotelos_housekeeping;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /api/roomservice/ {
        rewrite ^/api/roomservice/(.*) /$1 break;
        proxy_pass http://hotelos_roomservice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /api/maintenance/ {
        rewrite ^/api/maintenance/(.*) /$1 break;
        proxy_pass http://hotelos_maintenance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
}

