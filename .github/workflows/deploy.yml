name: Deploy HotelOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/hotelos
            git fetch origin main
            git reset --hard origin/main
            
            # Python venv va dependencies
            python3 -m venv venv
            venv/bin/pip install -q -r requirements.txt
            
            # Restart services
            sudo systemctl restart hotelos-reception
            sudo systemctl restart hotelos-housekeeping
            sudo systemctl restart hotelos-roomservice
            sudo systemctl restart hotelos-maintenance
            sudo systemctl restart hotelos-dashboard
            
            # Health check
            sleep 3
            curl -sf http://localhost:8001/rooms > /dev/null && echo "✅ Reception OK" || echo "❌ Reception FAILED"
            curl -sf http://localhost:8002/queue > /dev/null && echo "✅ Housekeeping OK" || echo "❌ Housekeeping FAILED"
            curl -sf http://localhost:8003/menu > /dev/null && echo "✅ Room Service OK" || echo "❌ Room Service FAILED"
            curl -sf http://localhost:8004/requests > /dev/null && echo "✅ Maintenance OK" || echo "❌ Maintenance FAILED"
            curl -sf http://localhost:8080/ > /dev/null && echo "✅ Dashboard OK" || echo "❌ Dashboard FAILED"
